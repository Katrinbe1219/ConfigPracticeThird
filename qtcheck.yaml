program:
  # загружаем два числа в память
  - op: const
    args:
      - A: 6
      - B: 50       # значение op1
      - C: 1000     # адрес в памяти для op1

  - op: const
    args:
      - A: 6
      - B: 30       # значение op2
      - C: 1008     # адрес в памяти для op2

  # выполняем команду "qt" для сравнения op1 > op2
  - op: qt
    args:
      - A: 44        # opcode qt
      - B: 1000      # адрес op1
      - C: 0         # смещение для записи результата
      - D: 1016      # базовый адрес для результата
      - E: 1008      # адрес op2
